name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Quality gate — must pass before we build or deploy. tsc, lint, and tests are
  # all hard gates. The former lint debt (react-hooks rules plus a few stray
  # any/unused-var/prefer-const) has been cleared, so lint now blocks deploys on
  # any new error. (`eslint .` exits 0 on warnings, so the remaining advisory
  # exhaustive-deps warnings don't fail the build.)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

  # Non-blocking E2E: runs the Playwright suite against the staging Supabase
  # project in parallel with build/deploy. Deliberately NOT in deploy's needs
  # chain — a red e2e job never blocks the deploy (flip to blocking once the
  # suite has proven stable on CI). Requires the STAGING_ENV_FILE repo secret
  # (the exact contents of .env.staging.local).
  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Write staging env
        run: printf '%s' "$STAGING_ENV_FILE" > .env.staging.local
        env:
          STAGING_ENV_FILE: ${{ secrets.STAGING_ENV_FILE }}
      - name: E2E tests (staging)
        run: npm run test:e2e -- --reporter=list,html
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_APP_VERSION: ${{ github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
